<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Support local food programs</title>
    <script src="https://cdn.funstaging.com/widget/AJEKLTFR"></script>
    <style>
      :root {
        --bg: #f5f6f8;
        --text: #1f2933;
        --muted: #5f6b7a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--text);
        background: var(--bg);
        line-height: 1.5;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 64px 16px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 32px;
        line-height: 1.2;
      }
      p {
        margin: 0 0 16px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Support local food programs</h1>
      <p>
        Every week we deliver fresh groceries to families and seniors in our neighborhood. Your donation keeps the
        pantry stocked and the delivery vans on the road.
      </p>
      <a href="#XZAQDCBY" style="display: none"></a>
    </main>
  </body>
</html>
