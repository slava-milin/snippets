<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Support local food programs</title>
    <script>
      window.__fruWebMcpDemo = 'disabled';
    </script>
    <script src="https://cdn.funstaging.com/widget/AJEKLTFR"></script>
    <script src="webmcp-status.js"></script>
    <style>
      :root {
        --bg: #f5f6f8;
        --text: #1f2933;
        --muted: #5f6b7a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--text);
        background: var(--bg);
        line-height: 1.5;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 64px 16px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 32px;
        line-height: 1.2;
      }
      p {
        margin: 0 0 16px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Support local food programs</h1>
      <p>
        Every week we deliver fresh groceries to families and seniors in our neighborhood. Your donation keeps the
        pantry stocked and the delivery vans on the road.
      </p>
      <a href="#XZAQDCBY" style="display: none"></a>
      <noscript>
        <section aria-label="Ways to give">
        <h2>Ways to give</h2>
        <p>One-time: $1,000 · $500 · $300 · $100 · $55 · $25, or any amount.</p>
        <p>Monthly: $250 · $130 · $55 · $35 · $10 · $5, or any amount.</p>
        <p>
          <a href="https://slava-milin.github.io/snippets/give-1.html?form=FUNTRNNDMMH&amp;amount=55&amp;currency=USD&amp;recurring=once">Give $55 once</a> ·
          <a href="https://slava-milin.github.io/snippets/give-1.html?form=FUNTRNNDMMH&amp;amount=35&amp;currency=USD&amp;recurring=monthly">Give $35 monthly</a>
        </p>
        <p>Any amount: open https://slava-milin.github.io/snippets/give-1.html?form=FUNTRNNDMMH and add amount, currency (USD, EUR, GBP...) and recurring (once or monthly), for example https://slava-milin.github.io/snippets/give-1.html?form=FUNTRNNDMMH&amp;amount=50&amp;currency=USD&amp;recurring=monthly</p>
      </section>
      </noscript>
      <p>
        <a href="https://ajekltfr.demo-donorsupport.com/agentic-giving.md" rel="agentic-giving">Agentic Giving</a>
      </p>
    </main>
  </body>
</html>
